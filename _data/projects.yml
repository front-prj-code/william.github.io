# 说明：
# - category_slug 必须等于分类名的小写（前端按按钮文字小写精确匹配）。
#   分类名含 & 时，slug 里也要有 &，例如 "Wallet & Assets" -> "wallet & assets"。
# - 配图目前是自绘 SVG 线框稿（assets/images/projects/），不是真实截图。
#   换成真实作品稿时只改 image 字段即可。建议导出 16:10、单张压到 200KB 以内。

categories:
  - name: "All"
    filter: "all"
  - name: "Trading UI"
    filter: "trading ui"
  - name: "Mobile"
    filter: "mobile"
  - name: "Wallet & Assets"
    filter: "wallet & assets"
  - name: "Admin & Risk"
    filter: "admin & risk"
  - name: "Design System"
    filter: "design system"
  - name: "Brand & Visual"
    filter: "brand & visual"
  - name: "AI Products"
    filter: "ai products"

items:
  # ---------- Trading UI ----------
  - title: "Spot & Futures Trading Terminal"
    slug: "proj-terminal"
    category: "Trading UI"
    category_slug: "trading ui"
    image: "assets/images/projects/proj-terminal.svg"
    alt: "Spot and futures trading terminal"
    description: "Web trading terminal covering candlesticks, order book, depth, orders and fills, funding rate, liquidation and insurance fund. Designed around live data: WebSocket delta updates, state coalescing, and a hierarchy that still reads when the market moves fast."

  - title: "Order Book & Depth Visualisation"
    slug: "proj-orderbook"
    category: "Trading UI"
    category_slug: "trading ui"
    image: "assets/images/projects/proj-orderbook.svg"
    alt: "Order book and depth visualisation"
    description: "The densest screen in the product, and the one that gets read under pressure. Price ladder, cumulative depth, spread indicator and last-trade marker, tuned so bids, asks and the spread stay legible at a glance on both wide and narrow screens."

  - title: "Candlestick & Market Data Components"
    slug: "proj-charts"
    category: "Trading UI"
    category_slug: "trading ui"
    image: "assets/images/projects/proj-charts.svg"
    alt: "Candlestick and market data components"
    description: "A charting layer used across web and mobile: candles, volume, indicator overlays, drawing tools and empty or stale-data states. Built to reuse, so a new market view does not mean a new chart implementation."

  # ---------- Mobile ----------
  - title: "Mobile Trading App"
    slug: "proj-mobile"
    category: "Mobile"
    category_slug: "mobile"
    image: "assets/images/projects/proj-mobile.svg"
    alt: "Mobile trading app"
    description: "React Native app carrying the same trading surface onto a smaller screen. One-hand reach for the order panel, a staged confirmation before opening a leveraged position, and a clear route back when a request times out mid-trade."

  # ---------- Wallet & Assets ----------
  - title: "Wallet Connect & Signing Flow"
    slug: "proj-wallet"
    category: "Wallet & Assets"
    category_slug: "wallet & assets"
    image: "assets/images/projects/proj-wallet.svg"
    alt: "Wallet connect and signing flow"
    description: "The signing journey designed as one continuous flow: connect wallet, pick asset, get a quote, confirm, sign, broadcast, wait for confirmation, recover from failure. Every step needed a visible state, because a silent step here reads as a lost transaction."

  - title: "Deposit / Withdrawal Centre"
    slug: "proj-deposit"
    category: "Wallet & Assets"
    category_slug: "wallet & assets"
    image: "assets/images/projects/proj-deposit.svg"
    alt: "Deposit and withdrawal centre"
    description: "Multi-chain deposits and withdrawals: address generation, network selection, confirmation progress, limits and fee breakdown. The design problem is trust. People check the address three times, so the screen has to reward that rather than fight it."

  # ---------- Admin & Risk ----------
  - title: "Operations & Risk Console"
    slug: "proj-ops"
    category: "Admin & Risk"
    category_slug: "admin & risk"
    image: "assets/images/projects/proj-ops.svg"
    alt: "Operations and risk console"
    description: "Internal console for asset audit, abnormal trades, node status, alerting and system health. Dense by design: operators live in it for a whole shift, so scan paths and colour semantics matter more than breathing room."

  - title: "Withdrawal Approval & Audit Trail"
    slug: "proj-audit"
    category: "Admin & Risk"
    category_slug: "admin & risk"
    image: "assets/images/projects/proj-audit.svg"
    alt: "Withdrawal approval and audit trail"
    description: "Approval flow for high-risk actions, with the full trail of who did what and when. Confirmation, feedback and auditability were the constraints, not decoration, since a mis-click here moves real money."

  # ---------- Design System ----------
  - title: "Exchange Design System"
    slug: "proj-ds"
    category: "Design System"
    category_slug: "design system"
    image: "assets/images/projects/proj-ds.svg"
    alt: "Exchange design system"
    description: "The component set this product actually needs: forms, tables, modals, toasts, status tags and trading-specific blocks, built with web, H5 and app in mind. Cut repeated design work and kept platforms from drifting apart."

  - title: "Tokens, Type Scale & Motion Specs"
    slug: "proj-tokens"
    category: "Design System"
    category_slug: "design system"
    image: "assets/images/projects/proj-tokens.svg"
    alt: "Design tokens, type scale and motion specs"
    description: "Colour, spacing, elevation and type tokens with the motion layer on top: durations, easing curves and Lottie and Rive specs for interaction and marketing animation. Written down so animation is specified rather than improvised per screen."

  # ---------- Brand & Visual ----------
  - title: "Overseas Campaign Visuals"
    slug: "proj-campaign"
    category: "Brand & Visual"
    category_slug: "brand & visual"
    image: "assets/images/projects/proj-campaign.svg"
    alt: "Overseas campaign visuals"
    description: "Marketing visuals for international campaigns, aimed at European, American and Southeast Asian audiences. Same brand core, different cultural reading: typography weight, imagery and colour temperature all shift with the market."

  - title: "Brand Identity & Marketing Kit"
    slug: "proj-identity"
    category: "Brand & Visual"
    category_slug: "brand & visual"
    image: "assets/images/projects/proj-identity.svg"
    alt: "Brand identity and marketing kit"
    description: "Identity system with the practical pieces attached: logo lockups, colour and type rules, social templates and presentation layouts, so a campaign can be assembled without redrawing the brand each time."

  - title: "Metaverse Space Concept"
    slug: "proj-metaverse"
    category: "Brand & Visual"
    category_slug: "brand & visual"
    image: "assets/images/projects/proj-metaverse.svg"
    alt: "Metaverse space concept"
    description: "Spatial concept for a branded Web3 environment: layout, zones, lighting direction and how a user is meant to move through it. An exploration of brand presence beyond the flat screen."

  # ---------- AI Products ----------
  - title: "AI Knowledge Assistant UI"
    slug: "proj-ai"
    category: "AI Products"
    category_slug: "ai products"
    image: "assets/images/projects/proj-ai.svg"
    alt: "AI knowledge assistant interface"
    description: "Interface for an enterprise RAG and agent product: conversation states, citation display, streaming responses, tool-call feedback and failure handling. Most of the work went into making the system's uncertainty visible instead of hiding it."

  - title: "AIGC Visual Exploration Pipeline"
    slug: "proj-aigc"
    category: "AI Products"
    category_slug: "ai products"
    image: "assets/images/projects/proj-aigc.svg"
    alt: "AIGC visual exploration pipeline"
    description: "A working method rather than a single deliverable: ComfyUI and FLUX used to generate and iterate visual directions, then take the surviving option into a real interface. Shortens the loop from concept to a clickable demo."
