- title: "Design Systems & Component Libraries"
  icon: "./assets/images/icon-quote.svg"
  alt: "design system icon"
  description: "Colour, spacing and type tokens plus buttons, forms, tables, modals, toasts and status tags, so multi-platform delivery stops turning into a redesign every time."

- title: "Motion Design"
  icon: "./assets/images/icon-app.svg"
  alt: "motion design icon"
  description: "Interaction and marketing animation specified in Lottie and Rive: durations, easing and state transitions written down, so motion is a decision rather than whatever the implementer picks."

- title: "Design-to-Code & AIGC Exploration"
  icon: "./assets/images/icon-dev.svg"
