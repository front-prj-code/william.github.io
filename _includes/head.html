<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.work %}{{ page.work.title }} · {{ site.data.profile.name }}{% else %}{{ site.data.profile.name }} · {{ site.data.profile.title }}{% endif %}</title>
  <meta name="description" content="{% if page.work %}{{ page.work.lede }}{% else %}{{ site.description }}{% endif %}">

  <!-- favicon -->
  <link rel="shortcut icon" href="{{ page.base }}/assets/images/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="{{ page.base }}/assets/images/favicon.png">

  <!-- fonts are self-hosted (see @font-face in style.css) -->
  <link rel="preload" as="font" type="font/woff2" href="{{ page.base }}/assets/fonts/poppins-latin-400.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="{{ page.base }}/assets/fonts/poppins-latin-500.woff2" crossorigin>

  <!-- custom css link -->
  <link rel="stylesheet" href="{{ page.base }}/assets/css/style.css">
</head>
