<article class="contact" data-page="contact">

  <header>
    <h2 class="h2 article-title">Contact</h2>
  </header>

  <section class="contact-form">

    <h3 class="h3 form-title">Say hello</h3>

    <p class="contact-note">
      Happy to talk about remote product design and front-end roles. Email or Telegram gets the fastest reply.
    </p>

    <ul class="contact-links">

      <li class="contact-link-item">
        <div class="contact-link-icon">
          <ion-icon name="mail-outline"></ion-icon>
        </div>
        <div>
          <p class="contact-link-label">Email</p>
          <a href="mailto:{{ site.data.profile.contacts.email }}" class="contact-link-value">{{ site.data.profile.contacts.email }}</a>
        </div>
      </li>

      <li class="contact-link-item">
        <div class="contact-link-icon">
          <ion-icon name="paper-plane"></ion-icon>
        </div>
        <div>
          <p class="contact-link-label">Telegram</p>
          <a href="https://t.me/williamflyba" target="_blank" rel="noopener noreferrer" class="contact-link-value">@williamflyba</a>
        </div>
      </li>

      <li class="contact-link-item">
        <div class="contact-link-icon">
          <ion-icon name="logo-github"></ion-icon>
        </div>
        <div>
          <p class="contact-link-label">GitHub</p>
          <a href="https://github.com/front-prj-code" target="_blank" rel="noopener noreferrer" class="contact-link-value">front-prj-code</a>
        </div>
      </li>

      <li class="contact-link-item">
        <div class="contact-link-icon">
          <ion-icon name="location-outline"></ion-icon>
        </div>
        <div>
          <p class="contact-link-label">Location</p>
          <address class="contact-link-value">Remote · Global</address>
        </div>
      </li>

    </ul>

  </section>

</article>
